name: Auto-update LoL Match Data

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (ajustable)
    - cron: '0 6 * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub cuando quieras probarlo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-synergies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Descargar CSV desde Google Drive
        run: |
          pip install --upgrade gdown
          gdown --id 1hnpbrUpBMS1TZI7IovfpKeZfWJH1Aptm -O matches.csv

      - name: Procesar partidas y generar synergies.json
        run: node parse.mjs

      - name: Commit y Push de los nuevos datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verificar si public/synergies.json cambió
          if git status --porcelain public/synergies.json | grep -q 'public/synergies.json'; then
            echo "Nuevos datos detectados. Guardando commit..."
            git add public/synergies.json
            git commit -m "chore(data): auto-update synergies [skip ci]"
            git push
          else
            echo "Sin partidas nuevas. No se requiere commit."
          fi